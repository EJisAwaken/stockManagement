spring.application.name=stock
server.port=${SERVER_PORT:8095}

# --- Compression HTTP (pages < 500 Ko en 3G, cahier §6) ---
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/html,text/plain,text/css,text/csv,application/javascript
server.compression.min-response-size=1024

server.shutdown=graceful

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Indian/Antananarivo

# --- Base de données (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/stock_db}
spring.datasource.username=${DB_USER:stock_user}
spring.datasource.password=${DB_PASS:stock_dev_pass}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Upload (import Excel, photos) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- JWT ---
# Secret OBLIGATOIRE hors dev (>= 32 octets). Le défaut ci-dessous est public :
# il ne sert qu'au poste de développement.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.secret-previous=${APP_JWT_SECRET_PREVIOUS:}
app.jwt.issuer=STOCK-IMPORT
app.jwt.expirationSeconds=900
app.jwt.refresh.ttl-seconds=2592000
app.jwt.refresh.cookie.name=stock_refresh
app.jwt.refresh.cookie.secure=${APP_COOKIE_SECURE:false}

# --- Sécurité ---
app.security.login.max-attempts=5
app.security.login.lock-minutes=5
app.security.password.min-length=8
app.cors.allowedOrigins=${APP_CORS_ORIGINS:http://localhost:3010}

# --- Amorçage du premier administrateur ---
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@stock.mg}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:124578}

# --- Métier ---
app.timezone=Indian/Antananarivo
# Stock dormant : aucune sortie depuis N jours (cahier §3.3)
app.stock.dormant-days=${APP_STOCK_DORMANT_DAYS:90}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

springdoc.swagger-ui.path=/swagger-ui.html
